name: flutter_application_1
description: "جمعمون جمعه! - بازی دورهمی حرفه‌ای و مهیج ایرانی"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/data/taboo/
    - assets/data/hot_potato/
    - assets/data/charades/
    - assets/data/five_seconds/
    - assets/data/drawing/
    - assets/data/decoder/
    - assets/sounds/
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
